        connection: github_shipfoxsandbox
        with:
          owner: ShipfoxSandbox
          repo: contract-tests
          issue_number: ${{ steps.parent.outputs.ref_number }}
          state: closed
      - key: close_parent_effect
        tool: issue_read.get
        connection: github_shipfoxsandbox
        with:
          owner: ShipfoxSandbox
          repo: contract-tests
          issue_number: ${{ steps.parent.outputs.ref_number }}
        outputs:
          value_state: '${{ has(result.state) ? result.state : "" }}'
        gate:
          success: step.status == "succeeded" && type(step.outputs.value_state) == type("") && step.outputs.value_state == "closed"
  update_issue_comment_human_author:
