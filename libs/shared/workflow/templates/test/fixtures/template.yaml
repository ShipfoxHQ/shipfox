title: Fixture ticket to pull request
summary: A small template used to test composition.
keywords: [fixture, testing]
starts: A ticket starts the test workflow
flow: []
writes: []
prerequisites: []
related: []
roles:
  tracker:
    providers: [linear, github]
  source:
    from: project
    providers: [github]
options:
  - id: ticket_write_back
    question: How should the workflow update the ticket?
    choices:
      - id: comment
        label: Add a comment
        default: true
        tradeoff: Keeps the ticket history together.
      - id: none
        label: Do not update the ticket
    applies_to: [linear, github]
slots:
  - id: setup_commands
    description: Commands to prepare the test repository.
  - id: test_command
    description: Command to test the workflow change.
secrets:
  - name: TRACKER_TOKEN
    description: Token the test workflow sends to its tracker.
variables:
  - name: TEST_COMMAND
    description: Test command configured for this workflow.
