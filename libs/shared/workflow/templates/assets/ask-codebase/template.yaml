id: ask-codebase
revision: 1
added_at: 2026-09-26
rank: 2
title: Ask the codebase in Slack
summary: Answer questions about your code in Slack, with references to the files.
roles:
  chat:
    providers: [slack]
  source:
    from: project
    providers: [github]
options:
  - id: entry_point
    question: How should people ask a question?
    choices:
      - id: mention
        label: Mention the app in Slack
        default: true
        tradeoff: The app answers when someone mentions it in the channels you pick.
      - id: dispatch_only
        label: Through another workflow
        tradeoff: Another workflow, such as a Slack dispatcher, starts this one. Pick it when another workflow already answers mentions, so each mention does not get two replies.
models:
  answer:
    note: Analyzes the repository to answer the Slack thread's question with one grounded reply. Needs a strong model with high thinking.
slots: []
secrets: []
variables: []
