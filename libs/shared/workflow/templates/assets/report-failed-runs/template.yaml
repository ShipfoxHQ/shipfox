id: report-failed-runs
revision: 1
added_at: 2026-09-26
title: Report failed Shipfox workflow runs
summary: Hear about every failed workflow run in Slack, with the failing step and an agent diagnosis of the cause.
roles:
  notify:
    providers: [slack]
options:
  - id: scope
    question: Which projects should report their failures?
    choices:
      - id: project
        label: This project
        default: true
        tradeoff: Only failures in this project are reported.
      - id: workspace
        label: Every project
        tradeoff: Failures from every project in the workspace go to one channel. Set up this workflow in one project only, or each failure is reported more than once.
  - id: workflow_filter
    question: Which workflows should report their failures?
    choices:
      - id: all
        label: Every workflow
        default: true
        tradeoff: Covers every workflow, including ones you add later.
      - id: selected
        label: Only the ones you pick
        tradeoff: If a picked workflow file is renamed or moved, its failures stop being reported until you update the list.
models:
  diagnose:
    note: Reads one failed run and its step logs, then writes a short diagnosis that cites the log lines.
slots: []
secrets: []
variables: []
