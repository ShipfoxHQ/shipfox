id: fix-default-branch-ci
revision: 1
added_at: 2026-09-26
title: Investigate and repair default-branch CI failures
summary: An agent investigates failed GitHub Actions runs on the default branch, classifies the cause, and opens a tested repair pull request when the cause is actionable.
roles:
  source:
    from: project
    providers: [github]
  report:
    providers: [slack]
    optional: true
    question: Should the workflow post repair pull requests to a Slack channel?
    tradeoff: Posts one Slack message per repair pull request, and optionally per failure that needs a person. Requires the Shipfox app in the chosen channel. External outages and skipped failures are never posted.
options:
  - id: pr_mode
    question: How should the repair pull request open?
    choices:
      - id: draft
        label: Draft
        default: true
        tradeoff: Someone marks the PR ready before review.
      - id: ready
        label: Ready for review
        tradeoff: Opens the PR for review right away, which can notify reviewers.
  - id: report_outcomes
    question: Which outcomes should the workflow post to Slack?
    applies_to: [slack]
    choices:
      - id: pull_requests
        label: Repair pull requests
        default: true
        tradeoff: Posts only when a repair PR opens.
      - id: pull_requests_and_diagnoses
        label: Repair pull requests and diagnoses
        tradeoff: Also posts the diagnosis when a person must act, such as an unexplained intermittent failure or a repair too large to deliver.
models:
  investigate:
    note: Reads failed CI logs and recent history, reproduces the failure, and repairs its cause. Needs a strong model with high thinking.
slots: [setup_commands, test_command]
secrets: []
variables: []
