title: Repair failing pull request CI
summary: Get a tested fix when CI fails on a dependency update or an opted-in pull request.
starts: CI fails on a selected GitHub pull request
keywords: [ci, dependencies, dependabot, renovate, pull-request]
flow:
  - kind: trigger
    provider: github
    title: CI fails on a selected pull request
    detail: A check fails on a dependency-bot pull request, a labeled pull request, or any same-repository pull request, depending on your choice.
  - kind: agent
    title: The agent finds the cause
    detail: It reads the failed logs and the changes in the pull request.
  - kind: check
    title: The workflow runs your checks again
    detail: The checks confirm that the fix works.
  - kind: write
    provider: github
    title: The workflow pushes the fix or proposes it
    detail: It pushes one commit to the pull request branch, or it posts a tested patch as a comment.
writes:
  - provider: github
    action: Pushes one commit to the pull request branch, unless it is set to comment only.
  - provider: github
    action: Comments on the pull request with the result.
prerequisites:
  - To push fixes, make sure branch rules let the Shipfox app push to the pull request branches.
related: [shipfox/fix-default-branch-ci]
roles:
  source:
    from: project
    providers: [github]
options:
  - id: pr_selection
    question: Which pull requests should the workflow repair?
    choices:
      - id: dependency_bot
        label: Dependency-bot pull requests
        default: true
        tradeoff: Repairs pull requests opened by one dependency bot after its initial CI run fails.
      - id: label
        label: Pull requests with a label
        tradeoff: Repairs same-repository pull requests that carry a chosen label when CI starts the repair. Anyone who can label a PR opts it in.
      - id: all_pull_requests
        label: All same-repository pull requests
        tradeoff: Repairs every pull request whose branch lives in the repository, including engineers' branches. Push mode then adds commits to branches people are working on.
  - id: bot_identity
    question: For dependency-bot pull requests, which bot opens them?
    choices:
      - id: dependabot
        label: Dependabot
        default: true
        tradeoff: Repairs pull requests authored by Dependabot after its initial CI run fails.
      - id: renovate
        label: Renovate
        tradeoff: Repairs pull requests authored by Renovate after its initial CI run fails.
      - id: custom
        label: Custom bot login
        tradeoff: Requires the exact GitHub login used by the bot.
  - id: delivery_mode
    question: What should the workflow do after the fix passes?
    choices:
      - id: push_fix
        label: Push the fix
        default: true
        tradeoff: Adds one commit to the pull request branch and posts the result. Existing auto-merge rules can merge the repair, and people working on the branch must pull it.
      - id: comment_only
        label: Comment only
        tradeoff: Leaves the branch unchanged and posts a tested patch or an actionable diagnosis.
models:
  fix:
    note: Reads failed CI logs and repairs the pull request branch.
slots:
  - id: setup_commands
    description: Shell commands to prepare the repository before tests run.
  - id: install_command
    description: Command to install project dependencies.
  - id: test_command
    description: Command to run the repository checks after the fix.
secrets: []
variables: []
