id: fix-dependency-ci
revision: 2
added_at: 2026-09-22
title: Fix failing dependency-bot CI
summary: An agent diagnoses failed dependency CI, validates repairs, and posts a patch or pushes the fix.
roles:
  source:
    from: project
    providers: [github]
options:
  - id: bot_identity
    question: Which dependency bot opens update pull requests?
    choices:
      - id: dependabot
        label: Dependabot
        default: true
        tradeoff: Repairs pull requests authored by Dependabot after its initial CI run fails.
      - id: renovate
        label: Renovate
        tradeoff: Repairs pull requests authored by Renovate after its initial CI run fails.
      - id: custom
        label: Custom bot login
        tradeoff: Requires the exact GitHub login used by the bot.
  - id: delivery_mode
    question: What should the workflow do after the fix passes?
    choices:
      - id: push_fix
        label: Push the fix
        default: true
        tradeoff: Updates the bot branch and posts the result. Existing auto-merge rules can merge the repair.
      - id: comment_only
        label: Comment only
        tradeoff: Leaves the branch unchanged and posts a tested patch or an actionable diagnosis.
models:
  fix:
    note: Reads failed CI logs and repairs the dependency update branch.
slots: [setup_commands, install_command, test_command]
secrets: []
variables: []
