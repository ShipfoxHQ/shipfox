title: Task to pull request
summary: Turn a ticket or a request into a tested GitHub pull request.
starts: An agent sends a task, or a ticket is ready in Linear, Jira, ClickUp, or GitHub
roles:
  tracker:
    providers: [linear, jira, clickup, github]
    optional: true
    question: Should tickets in an issue tracker start the workflow and receive its results?
    tradeoff: Starts from the tracker's ticket events and can comment on or move the ticket. Without a tracker, only manual starts with explicit task inputs, such as from a Slack dispatcher, run the workflow.
  source:
    from: project
    providers: [github]
options:
  - id: trigger_style
    question: What should start the workflow?
    applies_to: [linear]
    choices:
      - id: agent_session
        label: Assign or mention the Shipfox agent
        default: true
        tradeoff: Starts when the Shipfox agent is assigned to or mentioned on an issue in the chosen Linear team.
      - id: label
        label: Add a Linear label
        tradeoff: Starts when an issue in the chosen Linear team is created with the label or gets it later. Requires the label's exact name.
  - id: jira_trigger
    question: What should start the workflow?
    applies_to: [jira]
    choices:
      - id: label
        label: Add a Jira label
        default: true
        tradeoff: Starts when an issue in the chosen Jira project is created with the label or gets it later. Requires the label's exact name.
      - id: status
        label: Move the issue to a status
        tradeoff: Starts when an issue in the chosen Jira project moves to the status. Requires the status's exact name. Issues created directly in that status do not start it.
  - id: clickup_trigger
    question: What should start the workflow?
    applies_to: [clickup]
    choices:
      - id: tag
        label: Add a ClickUp tag
        default: true
        tradeoff: Starts when a task in the chosen List gets the tag. Requires the tag's exact name.
      - id: status
        label: Move to a ClickUp status
        tradeoff: Starts when a task in the chosen List moves to the status, including a task created in it. Requires the status's exact name.
  - id: github_trigger
    question: What should start the workflow?
    applies_to: [github]
    choices:
      - id: label
        label: Add a GitHub label
        default: true
        tradeoff: Starts when an open issue in the project's repository gets the label. Anyone who can label issues can start a run.
      - id: assignee
        label: Assign a GitHub user
        tradeoff: Starts when someone assigns an open issue in the project's repository to the chosen user, such as a machine user. GitHub cannot assign an issue to a GitHub App.
  - id: feedback_loop
    question: Should the workflow handle inline review comments and failed GitHub Actions runs after opening a PR?
    choices:
      - id: off
        label: Stop after opening the PR
        tradeoff: A person handles later feedback.
      - id: on
        label: Handle PR review comments and CI failures
        default: true
        tradeoff: Each batch of inline review comments or failed GitHub Actions runs starts another execution until the PR closes. Review summaries, PR conversation comments, and other CI providers are not handled.
  - id: resolve_threads
    question: Should the workflow resolve addressed inline review threads?
    choices:
      - id: addressed
        label: Resolve addressed threads
        default: true
        tradeoff: Resolves threads after fixes are pushed or comments are confirmed as already handled. Reviewers can reopen them.
      - id: never
        label: Leave threads open
        tradeoff: Reviewers resolve every thread themselves.
  - id: pr_mode
    question: How should the pull request open?
    choices:
      - id: draft
        label: Draft
        default: true
        tradeoff: Someone marks the PR ready before review.
      - id: ready
        label: Ready for review
        tradeoff: Opens the PR for review right away, which can notify reviewers.
  - id: ticket_write_back
    question: How should the workflow update the ticket?
    applies_to: [linear, jira, clickup, github]
    choices:
      - id: comment
        label: Comment only
        tradeoff: Posts the PR link, or clarification questions when needed.
      - id: comment_and_transition
        label: Comment and set in-progress status
        default: true
        tradeoff: Moves the issue to its in-progress status when work starts; posts the PR link or clarification questions. On GitHub, adds an in-progress label.
      - id: none
        label: No updates
        tradeoff: Makes no ticket updates.
models:
  fix:
    note: Implements the task and handles review comments and CI failures in one conversation.
  reply:
    note: Posts prepared review replies and resolves threads.
slots:
  - id: setup_commands
    description: Shell commands to prepare the repository before tests run.
  - id: test_command
    description: Command to run the repository checks after the agent changes code.
secrets: []
variables: []
