run_name: |
  run_name: 'Implement ${{ has(event.agentSession) ? event.agentSession.issue.identifier : event.data.identifier }}'
trigger: |
  # option:trigger_style=agent_session begin
  on_agent_session:
    source: linear_tracker # bind:tracker
    event: agentSession.created
    filter: >-
      has(event.agentSession.issue) && event.agentSession.issue != null &&
      event.agentSession.issue.team.key == "replace-with-team-key"
  # option:trigger_style=agent_session end
  # option:trigger_style=label begin
  on_label_added:
    source: linear_tracker # bind:tracker
    event: Issue.update
    filter: >-
      has(event.data.team) && event.data.team.key == "replace-with-team-key" &&
      has(event.updatedFrom) && has(event.updatedFrom.labelIds) &&
      event.data.labels.exists(label, label.name == "replace-with-label-name" &&
        !event.updatedFrom.labelIds.exists(id, id == label.id))
  on_labeled_issue_created:
    source: linear_tracker # bind:tracker
    event: Issue.create
    filter: >-
      has(event.data.team) && event.data.team.key == "replace-with-team-key" &&
      event.data.labels.exists(label, label.name == "replace-with-label-name")
  # option:trigger_style=label end
issue: |
  - key: issue
    env:
      ISSUE_ID: '${{ has(event.agentSession) ? event.agentSession.issue.id : event.data.id }}'
      ISSUE_IDENTIFIER: '${{ has(event.agentSession) ? event.agentSession.issue.identifier : event.data.identifier }}'
      ISSUE_TITLE: '${{ has(event.agentSession) ? event.agentSession.issue.title : event.data.title }}'
      ISSUE_URL: '${{ has(event.agentSession) ? event.agentSession.issue.url : event.data.url }}'
      ISSUE_DESCRIPTION: '${{ has(event.agentSession) ? (has(event.agentSession.issue.description) && event.agentSession.issue.description != null ? event.agentSession.issue.description : "") : (has(event.data.description) && event.data.description != null ? event.data.description : "") }}'
      ISSUE_REQUEST: '${{ has(event.agentSession) && has(event.agentSession.comment) && event.agentSession.comment != null ? event.agentSession.comment.body : "" }}'
    run: |
      printf 'id=%s\nidentifier=%s\ntitle=%s\nurl=%s\n' \
        "$ISSUE_ID" "$ISSUE_IDENTIFIER" "$ISSUE_TITLE" "$ISSUE_URL" >> "$SHIPFOX_OUTPUT"
      {
        echo 'description<<SHIPFOX_ISSUE_EOF'
        printf '%s\n' "$ISSUE_DESCRIPTION"
        echo 'SHIPFOX_ISSUE_EOF'
        echo 'request<<SHIPFOX_ISSUE_EOF'
        printf '%s\n' "$ISSUE_REQUEST"
        echo 'SHIPFOX_ISSUE_EOF'
      } >> "$SHIPFOX_OUTPUT"
    outputs:
      id: string
      identifier: string
      title: string
      url: string
      description: string
      request: string
read_tools: |
  integrations:
    - connection: linear_tracker # bind:tracker
      include: [get_issue, list_comments]
ask_questions: |
  - key: ask_questions
    if: ${{ steps.fix.outputs.status == "needs_clarification" }}
    tool: save_comment
    connection: linear_tracker # bind:tracker
    with:
      issueId: ${{ steps.issue.outputs.id }}
      body: |-
        Shipfox needs answers before it can implement this issue:

        ${{ steps.fix.outputs.questions }}
write_back: |
  - key: write_back
    tool: save_comment
    connection: linear_tracker # bind:tracker
    with:
      issueId: ${{ jobs.implement.outputs.issue_id }}
      body: 'Opened pull request: ${{ jobs.implement.outputs.pr_url }}'
transition: |
  - key: transition_ticket
    tool: save_issue
    connection: linear_tracker # bind:tracker
    with:
      id: ${{ jobs.implement.outputs.issue_id }}
      state: replace-with-linear-status
