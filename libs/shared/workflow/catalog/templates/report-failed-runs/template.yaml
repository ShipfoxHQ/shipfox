title: Report failed Shipfox workflow runs
summary: Hear about every failed workflow run in Slack or Discord, with the failing step and an agent diagnosis of the cause.
starts: A Shipfox workflow run fails
keywords: [monitoring, failures, diagnosis, alerts]
flow:
  - kind: trigger
    provider: shipfox
    title: A workflow run fails
    detail: The workflow watches every workflow in the project, or only the ones you pick.
  - kind: tool
    provider: shipfox
    title: The workflow reads the failed run
    detail: It gets the failed jobs and steps, the first error, and the last 15 log lines.
  - kind: write
    title: You get a report in chat
    detail: The report names the failed step, shows the log excerpt, and suggests a next step.
  - kind: agent
    title: The agent diagnoses the failure
    detail: It reads the failed logs and replies in the thread with the likely cause and a fix to try.
writes:
  - action: Posts a report and a diagnosis reply for each failed run. On Discord, the reply starts a thread under the report.
prerequisites:
  - With Slack, invite the Shipfox app to the report channel.
  - With Discord, give the Shipfox bot View Channel, Read Message History, Send Messages, Send Messages in Threads, and Create Public Threads in the report channel.
related: [shipfox/fix-default-branch-ci]
roles:
  notify:
    providers: [slack, discord]
options:
  - id: scope
    question: Which projects should report their failures?
    choices:
      - id: project
        label: This project
        default: true
        tradeoff: Only failures in this project are reported.
      - id: workspace
        label: Every project
        tradeoff: Failures from every project in the workspace go to one channel. Set up this workflow in one project only, or each failure is reported more than once.
  - id: workflow_filter
    question: Which workflows should report their failures?
    choices:
      - id: all
        label: Every workflow
        default: true
        tradeoff: Covers every workflow, including ones you add later.
      - id: selected
        label: Only the ones you pick
        tradeoff: If a picked workflow file is renamed or moved, its failures stop being reported until you update the list.
models:
  diagnose:
    note: Reads one failed run and its step logs, then writes a short diagnosis that cites the log lines.
slots: []
secrets: []
variables: []
