title: Route chat requests to your workflows
summary: Mention one chat app for any request, and it starts the workflow that handles it.
starts: Someone mentions the Shipfox app in chat with any request
keywords: [routing, chatops, intake, dispatcher]
flow:
  - kind: trigger
    title: Someone mentions the app in chat
    detail: They ask a question, ask for a ticket, or ask for a change in a thread.
  - kind: agent
    title: The agent picks a workflow
    detail: It reads the thread and chooses one workflow from your list, such as codebase questions, ticket creation, or task to pull request. It asks when the request is unclear or an input is missing.
  - kind: tool
    provider: shipfox
    title: The workflow starts the chosen workflow
    detail: It posts the run link in the thread. A repeated request gets the earlier run.
  - kind: write
    title: The result appears in the thread
    detail: The chosen workflow replies with an answer or a ticket link. For a change, the dispatcher posts the pull request link.
  - kind: human
    title: You review the result
    detail: You review and merge any pull request yourself.
writes:
  - provider: shipfox
    action: Starts one listed workflow per request.
  - action: Replies once in the thread, and later posts the pull request link for a change. On Discord, starts the thread under the mention when it has none.
prerequisites:
  - With Slack, invite the Shipfox app to each channel where it routes requests.
  - With Discord, let the Shipfox bot view each channel where it routes requests, read its history, send messages, send messages in threads, and create public threads there.
  - Set up each workflow it starts in the same project first. Set the codebase question and ticket workflows to start only from another workflow.
related: [shipfox/ask-codebase, shipfox/slack-to-ticket, shipfox/ticket-to-pr]
roles:
  chat:
    providers: [slack, discord]
options: []
models:
  route:
    note: Reads the chat thread, picks one listed workflow, and writes its inputs, or asks for what is missing. A mid-sized model is enough.
slots: []
secrets: []
variables: []
