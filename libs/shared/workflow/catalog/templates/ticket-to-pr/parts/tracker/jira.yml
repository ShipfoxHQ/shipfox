run_name: |
  run_name: 'Implement ${{ trigger.source == "manual" ? (has(inputs.identifier) ? inputs.identifier : (has(inputs.title) ? inputs.title : "a task")) : event.issue.key }}'
trigger: |
  # option:jira_trigger=label begin
  on_label_added:
    source: jira_tracker # bind:tracker
    event: jira:issue_updated
    filter: >-
      event.issue.fields.project.key == "replace-with-project-key" &&
      event.issue.fields.labels.exists(label, label == "replace-with-label-name") &&
      event.changelog.items.exists(item, has(item.fieldId) && item.fieldId == "labels" &&
        !(" " + (has(item.fromString) && item.fromString != null ? item.fromString : "") + " ").contains(" replace-with-label-name "))
  on_labeled_issue_created:
    source: jira_tracker # bind:tracker
    event: jira:issue_created
    filter: >-
      event.issue.fields.project.key == "replace-with-project-key" &&
      event.issue.fields.labels.exists(label, label == "replace-with-label-name")
  # option:jira_trigger=label end
  # option:jira_trigger=status begin
  on_status_changed:
    source: jira_tracker # bind:tracker
    event: jira:issue_updated
    filter: >-
      event.issue.fields.project.key == "replace-with-project-key" &&
      event.issue.fields.status.name == "replace-with-start-status" &&
      event.changelog.items.exists(item, has(item.fieldId) && item.fieldId == "status")
  # option:jira_trigger=status end
load_ticket: ''
ticket_env: |
  TICKET_ID: '${{ trigger.source == "manual" ? "" : event.issue.id }}'
  TICKET_IDENTIFIER: '${{ trigger.source == "manual" ? "" : event.issue.key }}'
  TICKET_TITLE: '${{ trigger.source == "manual" ? "" : (has(event.issue.fields.summary) ? event.issue.fields.summary : "") }}'
  TICKET_URL: '${{ trigger.source == "manual" ? "" : event.issue.self.split("/rest/")[0] + "/browse/" + event.issue.key }}'
  TICKET_DESCRIPTION: '${{ trigger.source == "manual" ? "" : (has(event.issue.fields.description) && type(event.issue.fields.description) == string ? event.issue.fields.description : "") }}'
  TICKET_REQUEST: ''
read_tools: |
  integrations:
    - connection: jira_tracker # bind:tracker
      include: [get_issue, get_issue_comments]
ask_questions: |
  # option:ticket_write_back=comment begin
  - key: ask_questions
    if: ${{ steps.fix.outputs.status == "needs_clarification" && steps.task.outputs.ticket_id != "" }}
    tool: add_comment
    connection: jira_tracker # bind:tracker
    with:
      idOrKey: ${{ steps.task.outputs.ticket_id }}
      body: |-
        Shipfox needs answers before it can implement this issue:

        ${{ steps.fix.outputs.questions }}
  # option:ticket_write_back=comment end
  # option:ticket_write_back=comment_and_transition begin
  - key: ask_questions
    if: ${{ steps.fix.outputs.status == "needs_clarification" && steps.task.outputs.ticket_id != "" }}
    tool: add_comment
    connection: jira_tracker # bind:tracker
    with:
      idOrKey: ${{ steps.task.outputs.ticket_id }}
      body: |-
        Shipfox needs answers before it can implement this issue:

        ${{ steps.fix.outputs.questions }}
  # option:ticket_write_back=comment_and_transition end
mark_in_progress: |
  # option:ticket_write_back=comment_and_transition begin
  - key: read_status
    if: ${{ steps.task.outputs.ticket_id != "" }}
    tool: get_issue
    connection: jira_tracker # bind:tracker
    with:
      idOrKey: ${{ steps.task.outputs.ticket_id }}
      fields: [status]
    outputs:
      started: ${{ result.fields.status.statusCategory.key != "new" }}
    gate:
      on_failure:
        restart_from: task
  # Transitions differ per project and status, so the ID is read at run time.
  - key: find_in_progress
    if: ${{ steps.task.outputs.ticket_id != "" && !steps.read_status.outputs.started }}
    tool: get_issue_transitions
    connection: jira_tracker # bind:tracker
    with:
      idOrKey: ${{ steps.task.outputs.ticket_id }}
    outputs:
      transition_id: '${{ (result.transitions.filter(t, t.to.statusCategory.key == "indeterminate").map(t, t.id) + [""])[0] }}'
    gate:
      on_failure:
        restart_from: task
  - key: mark_in_progress
    if: ${{ steps.task.outputs.ticket_id != "" && !steps.read_status.outputs.started && steps.find_in_progress.outputs.transition_id != "" }}
    tool: transition_issue
    connection: jira_tracker # bind:tracker
    with:
      idOrKey: ${{ steps.task.outputs.ticket_id }}
      transitionId: ${{ steps.find_in_progress.outputs.transition_id }}
    gate:
      on_failure:
        restart_from: task
  # option:ticket_write_back=comment_and_transition end
write_back: |
  # option:ticket_write_back=comment begin
  comment_only:
    needs: implement
    if: ${{ needs.all(n, n.status == "succeeded") && jobs.implement.outputs.pr_url != "" && jobs.implement.outputs.ticket_id != "" }}
    checkout: false
    steps:
      - key: write_back
        tool: add_comment
        connection: jira_tracker # bind:tracker
        with:
          idOrKey: ${{ jobs.implement.outputs.ticket_id }}
          body: 'Opened pull request: ${{ jobs.implement.outputs.pr_url }}'
  # option:ticket_write_back=comment end
  # option:ticket_write_back=comment_and_transition begin
  comment_on_ticket:
    needs: implement
    if: ${{ needs.all(n, n.status == "succeeded") && jobs.implement.outputs.pr_url != "" && jobs.implement.outputs.ticket_id != "" }}
    checkout: false
    steps:
      - key: write_back
        tool: add_comment
        connection: jira_tracker # bind:tracker
        with:
          idOrKey: ${{ jobs.implement.outputs.ticket_id }}
          body: 'Opened pull request: ${{ jobs.implement.outputs.pr_url }}'
  # option:ticket_write_back=comment_and_transition end
