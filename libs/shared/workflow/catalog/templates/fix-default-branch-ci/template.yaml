title: Investigate and repair default-branch CI failures
summary: Find out why CI broke on your default branch and get a tested repair pull request.
starts: GitHub Actions fails on the default branch
keywords: [ci, default-branch, repair, github-actions]
flow:
  - kind: trigger
    provider: github
    title: CI fails on the default branch
    detail: A GitHub Actions run fails on the default branch.
  - kind: agent
    title: The agent finds the cause
    detail: It reads the failed logs and the recent changes on the branch.
  - kind: write
    provider: github
    title: The agent opens a repair pull request
    detail: It opens a pull request only when it can fix the cause and your checks pass. If the cause is outside your code, such as a registry outage, it does nothing.
  - kind: write
    title: With Slack or Discord, you are notified
    detail: The workflow posts about failures that need a person, the repair pull requests it opens, or both.
writes:
  - provider: github
    action: Pushes a branch and opens a draft repair pull request.
  - action: With Slack or Discord, posts about failures that need a person, repair pull requests, or both.
prerequisites:
  - With Slack, invite the Shipfox app to the report channel.
  - With Discord, give the Shipfox bot access to the report channel.
related: [shipfox/fix-dependency-ci, shipfox/report-failed-runs]
roles:
  source:
    from: project
    providers: [github]
  report:
    providers: [slack, discord]
    optional: true
    question: Should the workflow notify you on Slack or Discord?
    tradeoff: Posts in a channel you choose about failures that need a person, the fix pull requests it opens, or both. Outages at external providers are never posted. Requires the Shipfox app in that Slack channel, or access for the Shipfox bot in that Discord channel.
options:
  - id: report_outcomes
    question: What should the workflow notify you about?
    applies_to: [slack, discord]
    choices:
      - id: needs_person
        label: Failures that need a person
        default: true
        tradeoff: Posts the agent's diagnosis when it cannot fix a failure, such as an unexplained intermittent failure or a fix too large to open as a pull request.
      - id: pull_requests
        label: Fix pull requests
        tradeoff: Posts a link each time the workflow opens a fix pull request. Failures it cannot fix are not posted.
      - id: both
        label: Both
        tradeoff: Posts both kinds of message.
models:
  investigate:
    note: Reads failed CI logs and recent history, reproduces the failure, and repairs its cause. Needs a strong model with high thinking.
slots:
  - id: setup_commands
    description: Shell commands to prepare the repository before tests run.
  - id: test_command
    description: Command to run the repository checks after the repair.
secrets: []
variables: []
