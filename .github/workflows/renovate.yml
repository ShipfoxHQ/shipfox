name: Renovate

on:
  schedule:
    # renovate.json extends schedule:daily (before 04:00 UTC). Several runs in
    # that window let Renovate work past prHourlyLimit.
    - cron: "15 0-3 * * *"
  issues:
    types: [edited]
  workflow_dispatch:
    inputs:
      log-level:
        description: Renovate log level
        type: choice
        default: info
        options: [info, debug]

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

env:
  cache_dir: /tmp/renovate/cache/renovate/repository
  cache_key: renovate-repository-cache

jobs:
  renovate:
    name: Renovate
    # Dashboard checkbox clicks arrive as issue edits. Renovate's own edits are
    # ignored so a run does not trigger the next one.
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.title == 'Dependency Dashboard' && github.event.sender.type == 'User')
    # Renovate's pnpm lockfile updates peak above 3 GB of memory.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Installation tokens expire after one hour.
    timeout-minutes: 45

    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_BOT_APP_PRIVATE_KEY }}

      - name: Resolve bot identity
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          {
            echo "RENOVATE_USERNAME=${APP_SLUG}[bot]"
            echo "RENOVATE_GIT_AUTHOR=${APP_SLUG}[bot] <${user_id}+${APP_SLUG}[bot]@users.noreply.github.com>"
          } >> "$GITHUB_ENV"

      - name: Restore repository cache
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.cache_dir }}
          key: ${{ env.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.cache_key }}-

      # The Renovate container runs as user 12021 and cannot read files the runner restored.
      - name: Fix restored cache ownership
        if: steps.cache-restore.outputs.cache-matched-key != ''
        run: sudo chown -R 12021:0 /tmp/renovate/

      - name: Run Renovate
        uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_REPOSITORY_CACHE: enabled

      - name: Save repository cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.cache_dir }}
          key: ${{ env.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
