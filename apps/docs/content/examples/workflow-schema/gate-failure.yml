name: Fix until tests pass
jobs:
  fix:
    steps:
      - key: install
        run: pnpm install
      - key: fix
        prompt: Fix the failing test.
      - key: test
        run: ./scripts/test.sh # writes failure-kind.txt when the tests fail
        outputs:
          failure_kind:
            type: string
            from_file: failure-kind.txt
        gate:
          on_failure:
            - if: has(step.outputs.failure_kind) && step.outputs.failure_kind == "assertion"
              restart_from: fix
              feedback: The tests still fail. Reproduce the failure first.
            - if: has(step.outputs.failure_kind) && step.outputs.failure_kind == "flaky"
              restart_from: install
              max_attempts: 2
