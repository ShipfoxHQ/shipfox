name: Publish outputs
jobs:
  build:
    steps:
      - key: revision
        run: git rev-parse HEAD
        outputs:
          commit:
            type: string
            from_stdout: true
      - key: version
        run: printf 'sha=%s\ncount=3\n' "$(git rev-parse HEAD)" >> "$SHIPFOX_OUTPUT"
        outputs:
          sha: string
          count: number
          report:
            type: json
            schema:
              type: object
          outcome:
            type: string
            default: none
      - key: package
        run: git diff --cached --binary > .git/shipfox-repair.patch
        outputs:
          patch:
            type: string
            from_file: .git/shipfox-repair.patch
