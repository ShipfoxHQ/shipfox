name: Code reviewer
description: Reviews pull requests in this project and reports the main risks.
instructions:
  - Review the change like a senior engineer on this team.
  - file: ./.shipfox/prompts/review-rules.md
model: claude-sonnet-5
provider: anthropic
thinking: high
integrations:
  - include: [pull_request_read]
on:
  - source: slack_acme
    filter: request.channel_id == "C04PAYMENTS" || request.viewing_channel_id == "C04PAYMENTS"
  - source: linear_acme
    filter: "'payments' in request.labels"
