name: Notify
jobs:
  notify:
    steps:
      - key: message
        tool: send_message
        connection: slack_acme
        with:
          channel_id: C0ABC12345
          message: Run ${{ run.number }} started.
        outputs:
          ts: ${{ result.ts }}
          channel: ${{ result.channel }}
      - env:
          MESSAGE_TS: ${{ steps.message.outputs.ts }}
        run: printf 'Posted %s\n' "$MESSAGE_TS"
