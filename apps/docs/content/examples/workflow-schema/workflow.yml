name: Deploy
run_name: Deploy ${{ event.ref }}
triggers:
  push:
    source: github_acme
    event: push
concurrency:
  group: deploy-${{ event.ref }}
runner: shipfox
env:
  NODE_ENV: production
jobs:
  deploy:
    steps:
      - key: deploy
        run: echo "url=https://example.com" >> "$SHIPFOX_OUTPUT"
        outputs:
          url: string
    outputs:
      url: ${{ steps.deploy.outputs.url }}
outputs:
  url: ${{ jobs.deploy.outputs.url }}
