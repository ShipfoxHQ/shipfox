name: Review pull requests
triggers:
  ready:
    source: github_acme
    event: pull_request.ready_for_review
    filter: event.pull_request.base.ref == "main"
    secrets:
      REVIEW_TOKEN: review_token
  nightly:
    source: cron
    with:
      suite: full
    config:
      schedule: "0 2 * * *"
jobs:
  review:
    steps:
      - prompt: Review the change and report the main risks.
