provider: slack
modes: [real, fake]
steps:
  - tool: read_thread
    with:
      channel_id: $fixture.slack.read_channel.id
      message_ts: $fixture.slack.thread.ts
    # The parent comes first, then its two replies in order.
    expect:
      shape:
        messages: [{ts: string, text: string}]
      values:
        messages[0].ts: $fixture.slack.thread.ts
        messages[0].text: $fixture.slack.thread.text
        messages[1].ts: $fixture.slack.thread.reply_ts
        messages[2].ts: $fixture.slack.thread.last_reply_ts
