provider: linear
kind: round-trip
modes: [real, fake]
steps:
  - key: project
    tool: save_project
    with:
      name: Contract $marker
      addTeams: [$fixture.linear.write_team.id]
      summary: Holds the milestone of a contract.
    expect:
      shape: {id: string, uuid: string}
    effect:
      tool: get_project
      with:
        query: $steps.project.uuid
      expect:
        values:
          summary: Holds the milestone of a contract.
        matches:
          name: '^Contract contract-[0-9a-f-]+$'
  # The tools cannot delete a milestone, so it stays on its canceled project.
  - key: create
    tool: save_milestone
    with:
      project: $steps.project.uuid
      name: Contract milestone
      description: Created by a contract.
    expect:
      shape: {id: string, name: string}
      values:
        name: Contract milestone
    # The project is this run's, so its milestones can't come from an earlier run.
    effect:
      tool: get_milestone
      with:
        project: $steps.project.uuid
        query: $steps.create.id
      expect:
        values:
          name: Contract milestone
          description: Created by a contract.
  - key: update
    tool: save_milestone
    with:
      project: $steps.project.uuid
      id: $steps.create.id
      name: Contract milestone updated
      description: Updated by a contract.
    effect:
      tool: get_milestone
      with:
        project: $steps.project.uuid
        query: $steps.create.id
      expect:
        values:
          name: Contract milestone updated
          description: Updated by a contract.
  - key: cancel
    tool: save_project
    with:
      id: $steps.project.uuid
      state: canceled
    effect:
      tool: get_project
      with:
        query: $steps.project.uuid
      expect:
        values:
          status.type: canceled
