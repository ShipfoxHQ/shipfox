name: Carried env across gate restarts
runner: __RUNNER_LABEL__
triggers:
  on_push:
    source: __GITEA_SOURCE__
    event: push
    filter: 'event.ref == "refs/heads/main" && event.repository.full_name == "__GITEA_REPOSITORY__"'
jobs:
  skipped_on_rerun:
    steps:
      - key: lead
        run: |
          echo "LEAD=lead" >> "$SHIPFOX_ENV"
      - key: once
        if: ${{ step.attempt == 1 }}
        run: |
          mkdir -p once-bin
          echo "ONCE=first-pass" >> "$SHIPFOX_ENV"
          echo "once-bin" >> "$SHIPFOX_PATH"
      - key: review
        run: |
          if [ -f .review-failed-once ]; then
            echo "review passes after restart"
            exit 0
          fi
          touch .review-failed-once
          echo "review fails once"
          exit 1
        gate:
          success: step.exit_code == 0
          on_failure:
            restart_from: once
            feedback: retrying from once
      - key: verify
        run: |
          test "$LEAD" = lead
          if [ -n "${ONCE:-}" ]; then
            echo "ONCE leaked from the skipped step: $ONCE"
            exit 1
          fi
          case ":$PATH:" in
            *once-bin*) echo "once-bin leaked from the skipped step"; exit 1 ;;
          esac
          echo "skipped step carried nothing"
  rerun_with_new_values:
    steps:
      - key: lead
        run: |
          echo "LEAD=lead" >> "$SHIPFOX_ENV"
      - key: produce
        run: |
          if [ -f .produce-ran ]; then
            echo "VERSION=second" >> "$SHIPFOX_ENV"
            echo "second-bin" >> "$SHIPFOX_PATH"
          else
            touch .produce-ran
            echo "VERSION=first" >> "$SHIPFOX_ENV"
            echo "STALE=first-pass-only" >> "$SHIPFOX_ENV"
            echo "first-bin" >> "$SHIPFOX_PATH"
          fi
      - key: review
        run: |
          if [ -f .review-failed-once ]; then
            echo "review passes after restart"
            exit 0
          fi
          touch .review-failed-once
          echo "review fails once"
          exit 1
        gate:
          success: step.exit_code == 0
          on_failure:
            restart_from: produce
            feedback: retrying from produce
      - key: verify
        run: |
          test "$LEAD" = lead
          test "$VERSION" = second
          if [ -n "${STALE:-}" ]; then
            echo "STALE leaked from the first pass: $STALE"
            exit 1
          fi
          case ":$PATH:" in
            *first-bin*) echo "first-bin leaked from the first pass"; exit 1 ;;
          esac
          case ":$PATH:" in
            *second-bin*) ;;
            *) echo "second-bin is missing"; exit 1 ;;
          esac
          echo "later steps saw only the new values"
