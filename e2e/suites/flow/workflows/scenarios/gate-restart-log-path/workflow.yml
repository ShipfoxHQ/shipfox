name: Gate restart log path
runner: __RUNNER_LABEL__
triggers:
  on_push:
    source: __GITEA_SOURCE__
    event: push
    filter: 'event.ref == "refs/heads/main" && event.repository.full_name == "__GITEA_REPOSITORY__"'
jobs:
  build:
    steps:
      - key: prepare
        env:
          FAILED_LOG: '${{ has(step.restart) && has(step.restart.from.log_path) ? step.restart.from.log_path : "" }}'
        run: |
          if [ -f .review-failed-once ]; then
            if [ -z "$FAILED_LOG" ]; then
              echo "restart carried no log_path"
              exit 1
            fi
            if ! grep -q "review failure marker" "$FAILED_LOG"; then
              echo "failed attempt log is missing its marker"
              exit 1
            fi
            echo "found=review failure marker" >> "$SHIPFOX_OUTPUT"
            echo "prepare read the failed log"
          else
            echo "prepare first pass"
          fi
      - key: review
        run: |
          if [ -f .review-failed-once ]; then
            echo "review passes after restart"
            exit 0
          fi

          echo "review failure marker"
          touch .review-failed-once
          exit 1
        gate:
          success: step.exit_code == 0
          on_failure:
            restart_from: prepare
            feedback: retrying from prepare
      - key: verify
        env:
          FOUND: ${{ steps.prepare.outputs.found }}
        run: |
          echo "found in restarted step: $FOUND"
