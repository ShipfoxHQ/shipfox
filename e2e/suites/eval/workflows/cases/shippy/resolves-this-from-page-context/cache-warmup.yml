name: Cache warmup
runner: shipfox
triggers:
  manual:
    source: manual
jobs:
  warm:
    checkout: false
    steps:
      - key: warm
        run: |
          echo "Copying 12 GB of build artifacts to /var/cache/builds"
          echo "cp: error writing '/var/cache/builds/app.tar': No space left on device"
          exit 1
