name: Lint
runner: shipfox
triggers:
  manual:
    source: manual
jobs:
  lint:
    checkout: false
    steps:
      - key: eslint
        run: |
          echo "Linting 42 files"
          echo "src/report.ts:12:7  error  'total' is assigned a value but never used  no-unused-vars"
          exit 1
