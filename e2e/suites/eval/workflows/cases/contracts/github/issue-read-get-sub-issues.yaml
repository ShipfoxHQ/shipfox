provider: github
modes: [real]
steps:
  - tool: issue_read
    method: get_sub_issues
    with:
      owner: $fixture.github.repository.owner
      repo: $fixture.github.repository.name
      issue_number: $fixture.github.parent_issue.number
    expect:
      shape:
        result: [{number: number, title: string}]
      includes:
        result: {number: $fixture.github.sub_issue.number, title: $fixture.github.sub_issue.title}
