provider: github
modes: [real]
steps:
  - tool: pull_request_read
    method: get_files
    with:
      owner: $fixture.github.repository.owner
      repo: $fixture.github.repository.name
      pull_number: $fixture.github.pull_request.number
    expect:
      shape:
        result: [{filename: string, status: string}]
      includes:
        result: {filename: fixtures/notes.md, status: modified}
