provider: github
modes: [real, fake]
steps:
  - tool: issue_read
    method: get
    with:
      owner: $fixture.github.repository.owner
      repo: $fixture.github.repository.name
      issue_number: $fixture.github.issue.number
    expect:
      shape: {number: number, title: string, state: string, labels: list}
      values:
        number: $fixture.github.issue.number
        title: $fixture.github.issue.title
        state: open
