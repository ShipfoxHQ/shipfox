provider: claap
# Fake only: transcript search returns nothing on the free-plan sandbox, even for a recording whose
# transcript get_recording_transcript reads, while it works on a paid workspace. Checked 2026-10-20.
modes: [fake]
steps:
  - tool: search_recording_transcripts
    with:
      search:
        query: $fixture.claap.recording.keyword
        type: keyword
    expect:
      shape:
        recordings: [{recordingId: string, url: string, chunks: [{chunkId: string, text: string}]}]
      values:
        recordings[0].recordingId: $fixture.claap.recording.id
      matches:
        recordings[0].chunks[0].text: $fixture.claap.recording.keyword
