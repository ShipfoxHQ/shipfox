    issue: {key: E2ER-1, id: '10010', summary: 'E2E - Example issue'}
    comment: {id: '10000', body: 'This is a test comment used by contract tests, do not modify it.'}
    user: {account_id: '712020:f852ec40-ff63-415f-9dd3-1a681b8c9037', display_name: 'Noé Charmet'}
sentry:
  connection: sentry_shipfox
  fixtures:
    organization: {slug: shipfox, name: Shipfox}
    project: {id: '4512204696977488', slug: sandbox}
    # The issue that `sentry-fixture-seed.yaml` keeps alive with one event a day. Its events change,
