# The sandbox accounts the contract cases run against. The ids end up public, so they point at
# sandbox objects only.
#
# `fixtures` are objects that exist and that the connection can read. A fixture's `read` is the call
# the `fixtures` job makes to prove it still exists. Round-trip cases write only in the `write_*`
# containers.
#
# `targets` are objects that must fail, and only error cases read them. An `absent` target does not
# exist, and its value is one nobody can create by accident. An `inaccessible` target exists outside
# the connection's reach.
github:
  connection: github_shipfoxsandbox
  fixtures:
    repository: {owner: ShipfoxSandbox, name: contract-tests}
    # Issue 1 has a long markdown and unicode body, 32 comments, and three labels. Issues 5 to 34
    # fill a second page.
    issue:
      number: 1
      title: 'Fixture issue: markdown, unicode, long body'
      read:
        tool: issue_read
        method: get
        with:
          owner: $fixture.github.repository.owner
          repo: $fixture.github.repository.name
          issue_number: $fixture.github.issue.number
        expect:
          values: {number: $fixture.github.issue.number, title: $fixture.github.issue.title}
    closed_issue:
      number: 2
      title: 'Fixture issue: closed'
      read:
        tool: issue_read
        method: get
        with:
          owner: $fixture.github.repository.owner
          repo: $fixture.github.repository.name
          issue_number: $fixture.github.closed_issue.number
        expect:
          values: {number: $fixture.github.closed_issue.number, state: closed}
    parent_issue:
      number: 3
      title: 'Fixture issue: parent with sub-issue'
      read:
        tool: issue_read
        method: get
        with:
          owner: $fixture.github.repository.owner
          repo: $fixture.github.repository.name
          issue_number: $fixture.github.parent_issue.number
        expect:
          values: {number: $fixture.github.parent_issue.number}
    sub_issue:
      number: 4
      title: 'Fixture issue: sub-issue'
      read:
        tool: issue_read
        method: get
        with:
          owner: $fixture.github.repository.owner
          repo: $fixture.github.repository.name
          issue_number: $fixture.github.sub_issue.number
        expect:
          values: {number: $fixture.github.sub_issue.number}
    label: {name: contract-fixture}
    # Pull request 35 has a review with two threads, one reply, one resolved thread, and check runs.
    pull_request:
      number: 35
      title: 'Fixture PR: open, with review threads'
      read:
        tool: pull_request_read
        method: get
        with:
          owner: $fixture.github.repository.owner
          repo: $fixture.github.repository.name
          pull_number: $fixture.github.pull_request.number
        expect:
          values: {number: $fixture.github.pull_request.number, state: open}
    closed_pull_request:
      number: 36
      title: 'Fixture PR: closed'
      read:
        tool: pull_request_read
        method: get
        with:
          owner: $fixture.github.repository.owner
          repo: $fixture.github.repository.name
          pull_number: $fixture.github.closed_pull_request.number
        expect:
          values: {number: $fixture.github.closed_pull_request.number, state: closed, merged: false}
    merged_pull_request:
      number: 37
      title: 'Fixture PR: merged'
      read:
        tool: pull_request_read
        method: get
        with:
          owner: $fixture.github.repository.owner
          repo: $fixture.github.repository.name
          pull_number: $fixture.github.merged_pull_request.number
        expect:
          values: {number: $fixture.github.merged_pull_request.number, state: closed, merged: true}
    # Runs expire, so cases find the latest completed run through `list_workflow_runs`.
    workflow:
      id: 375690478
      file: fixture.yml
      name: Fixture
      read:
        tool: actions_get
        method: get_workflow
        with:
          owner: $fixture.github.repository.owner
          repo: $fixture.github.repository.name
          resource_id: $fixture.github.workflow.file
        expect:
          values: {id: $fixture.github.workflow.id, name: $fixture.github.workflow.name}
  targets:
    # The owner exists, so the call fails on the repository and not on the owner.
    missing_repository: {kind: absent, owner: ShipfoxSandbox, name: contract-absent-7f3a9c41}
    # A private repository outside the sandbox installation. GitHub answers as if it did not exist.
    private_repository: {kind: inaccessible, owner: ShipfoxHQ, name: cloud}
