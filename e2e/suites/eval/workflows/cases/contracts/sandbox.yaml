    issue: {id: '151508352', short_id: SANDBOX-1, title: Contract fixture event}
discord:
  connection: discord_shipfox_sandbox
  fixtures:
    # Discord ids are snowflakes, too large for a YAML number: keep every id quoted.
    server: {id: '1556715286223388702', name: 'Shipfox - Sandbox'}
    read_channel: {id: '1556715356926517279', name: contract-test-read}
    # A message in `read_channel` and a thread in it.
    message: {id: '1556715416456273941', content: 'Contract test read message, do not modify'}
    thread: {id: '1556728176573681897', name: Contract test thread}
    write_channel: {id: '1556728776744898701', name: contract-test-write}
