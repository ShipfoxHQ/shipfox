provider: posthog
modes: [real]
steps:
  - tool: read-data-schema
    with:
      query:
        kind: events
    expect:
      # The events come as a Markdown list inside text. PostHog drops a custom event from the list
      # once the project has sent none for 30 days, and the fixture events are all dated, so the
      # contract is the list itself and no event name.
      text:
        - '^events:\n- `All events`[^\n]*\n- `[^`\n]+`'
