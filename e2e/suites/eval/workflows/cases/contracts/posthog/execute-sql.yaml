provider: posthog
modes: [real]
steps:
  - tool: execute-sql
    with:
      query: >-
        SELECT count() FROM events WHERE event = 'contract_event'
        AND timestamp >= toDateTime('2026-09-01') AND timestamp < toDateTime('2026-10-01')
    expect:
      # PostHog formats SQL rows as text, even in a JSON result. The count is the last line.
      shape:
        results: string
      matches:
        results: '(^|\n)$fixture.posthog.event.count$'
