provider: posthog
modes: [real]
steps:
  - tool: execute-sql
    with:
      query: >-
        SELECT count() FROM events WHERE event = 'contract_event'
        AND timestamp >= toDateTime('2026-09-01') AND timestamp < toDateTime('2026-10-01')
    expect:
      shape:
        results: list
      values:
        results[0][0]: $fixture.posthog.event.count
