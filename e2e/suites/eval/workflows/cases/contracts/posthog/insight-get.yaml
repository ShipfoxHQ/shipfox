provider: posthog
modes: [real]
steps:
  - tool: insight-get
    with:
      id: $fixture.posthog.insight.id
    expect:
      shape: {id: number, short_id: string, name: string}
      values:
        id: $fixture.posthog.insight.id
        short_id: $fixture.posthog.insight.short_id
        name: $fixture.posthog.insight.name
