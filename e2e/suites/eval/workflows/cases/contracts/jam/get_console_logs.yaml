provider: jam
modes: [real, fake]
steps:
  - tool: getConsoleLogs
    with:
      jamId: $fixture.jam.video.id
      logLevel: [error]
    expect:
      shape:
        total: number
        returned: number
        hasMore: boolean
        events: [{console_message: string, console_level: string}]
      values:
        total: 2
        returned: 2
        hasMore: false
        events[0].console_level: error
        events[0].console_message: 'Failed to load resource: the server responded with a status of 500 (Internal Server Error)'
        events[1].console_message: Order failed 500 coupon_lookup_failed
