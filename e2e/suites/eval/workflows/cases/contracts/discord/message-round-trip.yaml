provider: discord
kind: round-trip
modes: [real]
steps:
  - key: send
    tool: send_message
    with:
      channel_id: $fixture.discord.write_channel.id
      message: Contract $marker
    expect:
      shape:
        id: string
        channel_id: string
        url: string
        messages: [{id: string, content: string}]
      values:
        channel_id: $fixture.discord.write_channel.id
    # The marker is in the text, so a pattern checks it. The message is this run's, so the values
    # below can't come from an earlier run.
    effect:
      tool: read_thread
      with:
        channel_id: $fixture.discord.write_channel.id
        message_id: $steps.send.id
      expect:
        values:
          messages[0].channel_id: $fixture.discord.write_channel.id
        matches:
          messages[0].content: '^Contract contract-[0-9a-f-]+$'
  - key: update
    tool: update_message
    with:
      channel_id: $fixture.discord.write_channel.id
      message_id: $steps.send.id
      message: Contract message updated
    expect:
      shape: {id: string, content: string}
    effect:
      tool: read_thread
      with:
        channel_id: $fixture.discord.write_channel.id
        message_id: $steps.send.id
      expect:
        values:
          messages[0].content: Contract message updated
  - key: react
    tool: add_reaction
    with:
      channel_id: $fixture.discord.write_channel.id
      message_id: $steps.send.id
      emoji: '✅'
    expect:
      values:
        emoji: '✅'
    effect:
      tool: read_thread
      with:
        channel_id: $fixture.discord.write_channel.id
        message_id: $steps.send.id
      expect:
        includes:
          messages[0].reactions: {emoji.name: '✅', me: true}
