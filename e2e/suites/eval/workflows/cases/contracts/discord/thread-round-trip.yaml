provider: discord
kind: round-trip
modes: [real, fake]
steps:
  - key: anchor
    tool: send_message
    with:
      channel_id: $fixture.discord.write_channel.id
      message: Contract $marker thread anchor
    expect:
      shape: {id: string}
    effect:
      tool: read_thread
      with:
        channel_id: $fixture.discord.write_channel.id
        message_id: $steps.anchor.id
      expect:
        values:
          messages[0].channel_id: $fixture.discord.write_channel.id
        matches:
          messages[0].content: '^Contract contract-[0-9a-f-]+ thread anchor$'
  # The sandbox has no tool to archive a thread, so it ends open and Discord archives it on its own.
  - key: thread
    tool: create_thread
    with:
      channel_id: $fixture.discord.write_channel.id
      name: Contract $marker
      message_id: $steps.anchor.id
    expect:
      shape: {id: string, channel_id: string, url: string}
      values:
        channel_id: $fixture.discord.write_channel.id
    # The marker is in the thread name, so it filters the read to this run's thread.
    effect:
      tool: list_channels
      with:
        name_contains: Contract $marker
        include_threads: true
      expect:
        includes:
          channels: {parent_id: $fixture.discord.write_channel.id, type: 11}
