provider: clickup
modes: [real, fake]
steps:
  - tool: get_task
    with:
      task_id: $fixture.clickup.task.id
    expect:
      shape:
        id: string
        name: string
        list: {id: string}
        tags: [{name: string}]
        custom_fields: [{id: string}]
      values:
        id: $fixture.clickup.task.id
        name: $fixture.clickup.task.name
        list.id: $fixture.clickup.list.id
      includes:
        tags: {name: $fixture.clickup.tag.name}
        custom_fields: {id: $fixture.clickup.text_field.id, value: $fixture.clickup.text_field.value}
