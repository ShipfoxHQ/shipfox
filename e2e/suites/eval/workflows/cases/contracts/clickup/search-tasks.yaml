provider: clickup
modes: [real, fake]
steps:
  - tool: search_tasks
    with:
      list_ids: [$fixture.clickup.list.id]
      page: 0
      include_closed: true
      subtasks: true
    # The list holds 104 tasks counting the closed one and the subtask, so the first page is not the last.
    expect:
      shape:
        tasks: [{id: string, name: string}]
        last_page: boolean
      values:
        last_page: false
