prompt: template:report-failed-runs
workspace:
  connections: [github]
  project:
    repository: acme/report-cli
persona: |
  Facts:
  - You lead a small team that maintains report-cli.
  - You want to hear about failed Shipfox workflow runs in Slack.
  - Slack is not connected to Shipfox, and you will not connect it today.

  Goal: failed workflow runs reported in a Slack channel.

  Scripted answers:
  - Told to connect Slack first: say you will not connect it today.
k: 3
max_turns: 20
timeout_seconds: 600
expect:
  outcome: blocked_on_connection
  missing_provider: slack
  max_questions: 3
