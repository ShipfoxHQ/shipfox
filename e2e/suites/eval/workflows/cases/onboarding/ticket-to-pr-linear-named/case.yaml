prompt: template:ticket-to-pr?tracker=linear
workspace:
  connections: [github, linear]
  project:
    repository: acme/report-cli
persona: |
  Facts:
  - You lead a small team that maintains report-cli.
  - Your tickets live in Linear, in the team ENG.
  - You want to start a run by assigning the Shipfox agent to an issue.
  - You want pull requests to open as drafts.
  - You want the agent to comment on the ticket, but never to move it to another status.
  - You want the agent to answer review comments and fix failed CI after the pull request
    opens, and to resolve the review threads it addressed.
  - The tests run with `npm test`.

  Goal: tickets in Linear that turn into pull requests.

  Scripted answers:
  - Asked to confirm the template and its providers: say yes.
  - Asked whether to open the workflow pull request now: say you want to review the file first.
k: 3
max_turns: 40
timeout_seconds: 1200
expect:
  outcome: validated
  template: shipfox/ticket-to-pr
  bindings: {tracker: linear, source: github}
  options: {trigger_style: agent_session, pr_mode: draft, ticket_write_back: comment}
  max_questions: 9
