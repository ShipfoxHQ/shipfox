template: shipfox/report-failed-runs
bindings: {notify: slack}
# An option left out keeps the blocks of every choice, so the case names the defaults.
options: {scope: project, workflow_filter: all}
placeholders:
  replace-with-project-id: $project.id
  replace-with-slack-channel-id: C0FAILURES
workflows:
  failing: failing-build.yml
modes: [scripted]
timeout_seconds: 600

covers:
  - Posts a report and a diagnosis reply for each failed run.

scenario:
  - fire: {workflow: failing, status: failed}
  # The failed run's `run.completed` event starts the report.
  - start: {triggered: true}
  - await: {run: succeeded}

expect:
  # The diagnosis reply in the thread is not expected. The report's `ts` output is parsed as a JSON
  # number, which the reply's `thread_ts` input rejects, and the diagnose job still succeeds. The
  # reply would show up here as an unexpected write.
  writes:
    # The report names the failed step and shows the end of its log.
    - slack.chat.postMessage:
        target: C0FAILURES
        text: {contains: ['Failing build #1', 'Failed: build › Compile', 'eval-compile-error: unexpected token']}
        count: 1
