template: shipfox/ticket-to-pr
bindings: {source: github}
options: {feedback_loop: 'off'}
slots:
  setup_commands: "- key: setup\n  run: npm ci --no-audit --no-fund"
  test_command: npm test
modes: [scripted]
repository: acme/report-cli
timeout_seconds: 600

covers:
  - Pushes a branch and opens a task pull request, as a draft by default.

scenario:
  - start:
      manual:
        inputs:
          repository: acme/report-cli
          title: Add a --json flag to the report command
          description: The report command only prints text. Scripts that read it need JSON.
          acceptance_criteria: With --json, the report command prints its rows as a JSON array.
  # Without the feedback loop there is no listening job, so the run ends once the PR is open.
  - await: {run: succeeded}
    timeout_seconds: 300

expect:
  outputs: {status: implemented}
  writes:
    - github.push: {branch: $pr.head, count: 1}
    - github.create_pull_request: {pull_request: $pr, base: main, draft: true, count: 1}
    - github.reply_to_review_comment: {count: 0}
    - github.resolve_review_thread: {count: 0}
