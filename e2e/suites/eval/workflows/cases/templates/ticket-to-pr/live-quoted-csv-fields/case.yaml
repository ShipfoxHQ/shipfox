template: shipfox/ticket-to-pr
bindings: {source: github}
# Without the feedback loop, the run ends once the pull request is open.
options: {feedback_loop: off}
slots:
  setup_commands: "- key: setup\n  run: npm ci --no-audit --no-fund"
  test_command: npm test
modes: [live]
repository: acme/csv-lite
timeout_seconds: 1200

scenario:
  - start:
      manual:
        inputs:
          repository: acme/csv-lite
          title: Support quoted fields in parseCsv
          description: parseCsv splits on every comma, so a quoted field that holds a comma breaks into two fields.
          acceptance_criteria: Quoted fields keep commas and line breaks, a doubled quote inside a quoted field reads as one quote, and plain rows parse as before.
  - await: {run: succeeded}
    timeout_seconds: 900

expect:
  outputs: {status: implemented}
  writes:
    - github.push: {branch: $pr.head, count: 1}
    - github.create_pull_request: {pull_request: $pr, base: main, draft: true, count: 1}

live:
  # Copied from hidden_tests/ into the pushed branch after the run, then run with test_command.
  hidden_tests: src/csv-quoted.test.js
