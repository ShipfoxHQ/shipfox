# The scripted cases fix-dependency-ci must keep. Each `case` is a directory next to this file.
cases:
  - case: push-fix
    proves: A failed run on a dependency bot's branch starts the repair, pushes one commit to the branch, and comments.
  - case: comment-only
    proves: The branch stays unchanged, and the comment carries the tested patch.
  - case: needs-human
    proves: A failure that needs a person gets a comment and no push.
