template: shipfox/slack-to-ticket
bindings: {chat: slack, tracker: linear, source: github}
# Every option is named, because an option left out keeps all of its blocks.
options:
  entry_point: mention
  ticket_project: team_only
placeholders:
  replace-with-channel-id: C0EVAL0001
  replace-with-team-key: ENG
modes: [scripted]
timeout_seconds: 600

covers:
  - Replies once in the thread.

# The thread the Slack fake serves. The scripted agent doesn't read it, so it only has to
# make sense next to the scenario.
seed:
  slack:
    channel: C0EVAL0001
    thread:
      - ts: '1721300000.000400'
        user: U0EVALUSER
        text: Webhooks that time out are dropped.
      - ts: '1721300030.000450'
        user: U0EVALBOT
        thread_ts: '1721300000.000400'
        text: Ticket ENG-42 tracks this thread
      - ts: '1721300060.000500'
        user: U0EVALUSER
        thread_ts: '1721300000.000400'
        text: '<@U0EVALBOT> create a ticket for this again'

scenario:
  - start:
      event:
        slack:
          app_mention:
            channel: C0EVAL0001
            ts: '1721300060.000500'
            thread_ts: '1721300000.000400'
            user: U0EVALUSER
            text: '<@U0EVALBOT> create a ticket for this again'
  - await: {run: succeeded}
    timeout_seconds: 300

expect:
  writes:
    # A mention inside a thread answers in the thread's parent, not under the mention.
    - linear.save_issue: {count: 0}
    - slack.chat.postMessage:
        target: C0EVAL0001
        thread_ts: '1721300000.000400'
        text: {contains: 'This thread already has ticket ENG-42'}
        count: 1
